[workspace]
members = [
    "crates/mv-types",
    "crates/mv-extract",
]
resolver = "2"

# The decoder is CPU-bound on tiny, call-heavy functions (CABAC bin decode,
# per-block context derivation). Fat LTO + a single codegen unit let those
# inline into the hot loops, which the default release profile (16 units, no
# LTO) leaves as real calls.
[profile.release]
lto = "fat"
codegen-units = 1
