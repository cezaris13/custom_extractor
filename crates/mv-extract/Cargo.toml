[package]
name = "mv-extract"
version = "0.1.0"
edition = "2021"

[features]
# Opt-in to bindings/behaviours that only exist in the custom FFmpeg patch
# (AVMotionVectorCompact, AV_FRAME_DATA_MOTION_VECTORS_COMPACT). The makefile
# enables this feature only when building against CUSTOM_PREFIX.
custom_ffmpeg = []

[dependencies]
# libavformat is used only for container demux; the compressed-domain MV
# extraction is hand-rolled (see thesis.rs / hevc.rs). The FFmpeg install to
# link against is selected at build time via `PKG_CONFIG_PATH`.
ffmpeg-sys-next = "8.1.0"
libc = "0.2"
mv-types = { path = "../mv-types" }

[lib]
name = "mv_extract"
path = "lib.rs"

# Thesis from-scratch compressed-domain extractor (hand-rolled H.264 + HEVC
# parsers; libavformat used only for container demux). See custom.rs / hevc.rs.
[[bin]]
name = "extractor"
path = "extractor.rs"
